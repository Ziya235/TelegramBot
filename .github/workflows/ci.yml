# CI for the Rivalio monorepo.
#
# Backend lives at the repository root (Express + Prisma). Frontend lives in
# frontend/ (Vite). Render deploys main only after this workflow reports a
# successful check when the service auto-deploy setting is "After CI Checks Pass".
# This workflow does not deploy and does not run database migrations.
# Feature-branch pushes do not start it. Open a pull request into main.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed components
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # A push to main is the commit Render may deploy, so both components
          # are checked even when the diff touches only one of them.
          if [ "${EVENT_NAME}" = "push" ]; then
            echo "backend=true" >> "${GITHUB_OUTPUT}"
            echo "frontend=true" >> "${GITHUB_OUTPUT}"
            echo "Push to main: backend and frontend checks will both run."
            exit 0
          fi

          files="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "Changed files:"
          printf '%s\n' "${files}"

          backend=false
          frontend=false
          if printf '%s\n' "${files}" | grep -Eq '^(backend/|prisma\.config\.ts$|package\.json$|package-lock\.json$|\.github/workflows/)'; then
            backend=true
          fi
          if printf '%s\n' "${files}" | grep -Eq '^(frontend/|render\.yaml$|\.github/workflows/)'; then
            frontend=true
          fi

          echo "backend=${backend}" >> "${GITHUB_OUTPUT}"
          echo "frontend=${frontend}" >> "${GITHUB_OUTPUT}"
          echo "Backend checks: ${backend}"
          echo "Frontend checks: ${frontend}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 20
    env:
      # Placeholder values so Prisma can load prisma.config.ts during generate.
      # They do not point at production. This job never runs prisma migrate.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Generate Prisma client
        run: npm run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run configured frontend checks and build
        working-directory: frontend
        run: |
          set -euo pipefail
          has_script() {
            node -e "const scripts=require('./package.json').scripts||{}; if(!scripts[process.argv[1]]) process.exit(1)" "$1"
          }
          if has_script lint; then
            echo "Running frontend lint."
            npm run lint
          else
            echo "No lint script in frontend/package.json. Lint was not run."
          fi
          if has_script test; then
            echo "Running frontend tests."
            npm test
          else
            echo "No test script in frontend/package.json. Tests were not run."
          fi
          echo "Building frontend."
          npm run build

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: always()
    steps:
      - name: Require component checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail
          echo "Detect changes: ${CHANGES_RESULT}"
          echo "Backend: ${BACKEND_RESULT}"
          echo "Frontend: ${FRONTEND_RESULT}"
          if [ "${CHANGES_RESULT}" != "success" ]; then
            echo "Change detection did not succeed."
            exit 1
          fi
          for result in "${BACKEND_RESULT}" "${FRONTEND_RESULT}"; do
            case "${result}" in
              success|skipped) ;;
              *)
                echo "A required component check finished as '${result}'."
                exit 1
                ;;
            esac
          done
          echo "CI passed. Component jobs either succeeded or were skipped because their files did not change."
